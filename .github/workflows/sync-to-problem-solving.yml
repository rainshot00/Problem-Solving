name: Sync to Problem-Solving

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Problem-Solving repo
        uses: actions/checkout@v4
        with:
          repository: rainshot00/Problem-Solving
          token: ${{ secrets.PS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add LeetCode remote and fetch
        run: |
          git remote add leetcode https://x-access-token:${{ secrets.PS_REPO_TOKEN }}@github.com/rainshot00/LeetCode.git
          git fetch leetcode main

      - name: Subtree pull (원본 커밋 그대로 병합)
        run: |
          git subtree pull --prefix=LeetCode leetcode main -m "Sync: rainshot00/LeetCode 최신 커밋 반영"

      - name: Push
        run: git push origin main
